<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>
      <p id="stats"></p>
      <div class="banner" id="banner"></div>

      <div class="controls">
        <button
          id="theme-toggle"
          class="theme-btn"
          aria-label="Toggle Dark Mode"
        >
          🌙
        </button>
        <input type="text" id="search-box" placeholder="Search tasks..." />

        <div class="input-group">
          <input type="text" id="add-box" placeholder="Add new task..." />
          <select id="priority-select" aria-label="Task priority">
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Low">Low</option>
          </select>
          <button id="add-btn">Add</button>
        </div>

        <div class="sort-buttons">
          <button id="sort-asc">A - Z</button>
          <button id="sort-desc">Z - A</button>
          <button id="check-btn" title="Check if any high-priority tasks are pending">
            Priority Check
          </button>
          <button id="next-btn" title="Cycle through pending tasks one at a time">
            Next Task
          </button>
        </div>

        <div class="filter-buttons" id="filter-buttons">
          <button data-filter="all" class="active">All</button>
          <button data-filter="high">High</button>
          <button data-filter="medium">Medium</button>
          <button data-filter="low">Low</button>
        </div>
      </div>

      <ul id="task-list"></ul>

      <div class="footer-row">
        <span id="storage-info"></span>
        <button id="clear-btn" class="clear-btn">Clear All</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
